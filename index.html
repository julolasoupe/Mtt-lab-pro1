   }else{
     history=[opener+' open 2 bb',defender+' call '+fmt(2-(defender==='SB'?.5:defender==='BB'?1:0))+' bb'];
     prePot=fmt(dead+4-((opener==='SB'?.5:opener==='BB'?1:0)+(defender==='SB'?.5:defender==='BB'?1:0)));
   }
   const used=new Set(h.map(c=>c.r+c.s));const full=[];
   while(full.length<5){const c={r:pick(ranks),s:pick(suits)};if(!used.has(c.r+c.s)){used.add(c.r+c.s);full.push(c)}}
   street=topic.includes('River')||topic==='Bluffcatch'||topic==='Overbet'?'River':topic.includes('Turn')||topic==='Delayed c-bet'||topic==='Probe bet'?'Turn':pick(['Flop','Turn','River']);
   board=full.slice(0,street==='Flop'?3:street==='Turn'?4:5);
   // Each earlier street is checked through: no phantom bets or impossible pot sizes.
   if(street!=='Flop')history.push('Flop '+full.slice(0,3).map(c=>c.r+c.s).join(' ')+' : check / check');
   if(street==='River')history.push('Turn '+full[3].r+full[3].s+' : check / check');
   pot=prePot;
   const betTopics=['Défense flop','Bluffcatch','Check-raise'];
   const bet=betTopics.includes(topic)||Math.random()<.4;
   if(bet){facing=fmt(Math.min(pot*pick([.33,.5,.75]),stack*.6));toCall=facing;history.push(street+' : '+villain+' bet '+facing+' bb',hero+' à parler');choices=['Fold','Call','Raise 3x','Shove']}
   else{history.push(street+' : '+villain+' check',hero+' à parler');choices=['Check','Bet 33%','Bet 75%','Overbet 125%']}
 }
 const score={};let advice='';
 // Scoring remains heuristic, but only offers actions that are legal in the constructed spot.
 if(phase==='pre'){
  if(facing===0){score['Raise 2 bb']=str>43?3:str>29?2:0;score.Fold=str<28?3:0;score.Shove=stack<=12&&str>46?3:stack>20?0:1;if(choices.includes('Limp'))score.Limp=stack>12?2:0;advice='Évalue la range d’ouverture par position, les blindes et les antes.'}
  else{score.Fold=str<32?3:str<42?2:0;score.Call=str>39&&stack>13?3:str>31?2:0;score['3-bet / Raise']=str>59&&stack>20?3:str>45?2:0;score.Shove=stack<=20&&str>50?3:stack>30?0:1;advice='La défense dépend des cotes, de la position et de la range adverse.'}
 }else{
  const made=board.some(c=>h.some(x=>x.r===c.r)),pair=h[0].r===h[1].r,draw=board.length<5&&h[0].s===h[1].s&&board.filter(c=>c.s===h[0].s).length>=2,value=made||pair;
  if(facing===0){score.Check=value?2:3;score['Bet 33%']=value||draw?3:2;score['Bet 75%']=value?3:draw?2:1;score['Overbet 125%']=value&&street==='River'?2:1}
  else{score.Fold=!value&&!draw?3:0;score.Call=value||draw?3:1;score['Raise 3x']=value&&str>52?2:draw?2:0;score.Shove=value&&stack<=15?2:0}
  advice='Évalue les ranges, le board, le SPR et les bloqueurs.';
 }
 const best=Math.max(...choices.map(x=>score[x]||0));
 const result={phase,topic,h,str,stack,hero,villain,villainType,board,street,pot,facing,toCall,choices,score,best,advice,icm,pko,history,id:Date.now()+Math.random()};
 validateSpot(result);return result;
}
function validateSpot(s){
 if(!seatOrder.includes(s.hero)||!seatOrder.includes(s.villain)||s.hero===s.villain)throw Error('Positions invalides');
 if(!s.history.length||!s.history.at(-1).includes('à parler'))throw Error('Historique incomplet');
 if(!(s.pot>0)||s.toCall<0||s.toCall>s.stack)throw Error('Pot ou montant à payer invalide');
 if(s.phase==='pre'&&s.facing>0&&s.choices.includes('Raise 2 bb'))throw Error('Action incompatible');
 if(s.phase==='post'&&s.board.length!==({Flop:3,Turn:4,River:5}[s.street]))throw Error('Board invalide');
 if(s.phase==='pre'&&s.topic==='RFI / open'&&s.facing!==0)throw Error('RFI invalide');
}

// Les étapes sont issues exclusivement de l'historique du spot. Aucune action adverse n'est simulée après la décision Hero.
let replayStep=0,replayTimer=null;
function stopReplay(){if(replayTimer!==null){clearInterval(replayTimer);replayTimer=null}}
function replayEvents(s){
 const ev=[];
 for(const raw of s.history){
  const text=String(raw),actor=positions.find(p=>text.startsWith(p+' '));
  if(text.includes('à parler')){ev.push({type:'turn',actor:s.hero,label:'À toi de jouer'});continue}
  if(/^Flop /.test(text)){ev.push({type:'flop',label:'Flop : check / check',cards:s.board.slice(0,3)});continue}
  if(/^Turn /.test(text)){ev.push({type:'turncard',label:'Turn : check / check',cards:s.board.slice(0,4)});continue}
  if(/^River /.test(text)){ev.push({type:'rivercard',label:text,cards:s.board.slice(0,5)});continue}
  if(/^(Flop|Turn|River) : /.test(text)){
    const match=text.match(/^(Flop|Turn|River) : (UTG|HJ|CO|BTN|SB|BB) (bet|check) ?([\d.]+)?/);
    if(match){const street=match[1],count={Flop:3,Turn:4,River:5}[street];ev.push({type:'streetaction',actor:match[2],action:match[3],amount:match[4]?+match[4]:0,cards:s.board.slice(0,count),label:text});continue}
  }
  if(actor){const m=text.match(/^(UTG|HJ|CO|BTN|SB|BB) (fold|open|call|3-bet|shove|check|bet) ?([\d.]+)?/);
   if(m){ev.push({type:'action',actor,action:m[2],amount:m[3]?+m[3]:0,label:text});continue}
  }
  ev.push({type:'note',label:text});
 }
 return ev;
}
function replayState(s){
 const ev=replayEvents(s),step=Math.max(0,Math.min(replayStep,ev.length));
 const folded=new Set(),wagers={},actions={},contributions={SB:.5,BB:1};
 let shown=[],active='',message='Blindes 0,5 / 1 bb + antes 0,1 bb par joueur',pot=2.1;
 for(let i=0;i<step;i++){
  const e=ev[i];message=e.label;
  if(e.cards)shown=e.cards;
  if(e.type==='flop'||e.type==='turncard'||e.type==='rivercard'){
   Object.keys(wagers).forEach(k=>delete wagers[k]);
   Object.keys(actions).forEach(k=>delete actions[k]);
  }
  if(e.type==='turn'){active=s.hero;continue}
  if(e.actor){active=e.actor;actions[e.actor]=e.action||'';if(e.action==='fold')folded.add(e.actor);
   if(e.amount>0){
    let added=0;
    if(e.action==='open'||e.action==='3-bet'||e.action==='shove'){
      added=Math.max(0,e.amount-(contributions[e.actor]||0));contributions[e.actor]=e.amount;
    }else{added=e.amount;contributions[e.actor]=(contributions[e.actor]||0)+added}
    wagers[e.actor]=e.action==='call'?contributions[e.actor]:e.amount;
    pot=Math.round((pot+added)*100)/100;
   }
  }
 }
 if(step===ev.length){pot=s.pot;shown=s.board;active=s.hero}
 return {ev,step,folded,wagers,actions,shown,active,message,pot};
}

" ${!selected||answered?'disabled':''}>Valider la décision</button><button class="btn" onclick="newSpot()">Passer au spot suivant →</button></div>${answered?feedbackHTML(s):''}</div>`}
function detailedAnalysis(s){
 const h=labelHand(s.h), pair=s.h[0].r===s.h[1].r, suited=s.h[0].s===s.h[1].s;
 const high=ranks[Math.min(ranks.indexOf(s.h[0].r),ranks.indexOf(s.h[1].r))];
 const posLate=['CO','BTN','SB'].includes(s.hero);
 const bullets=[];let calculation='',specific='',risk='';
 if(s.phase==='pre'){
   specific=`${h} est ${pair?'une paire servie':suited?'une main assortie':'une main dépareillée'}. ${pair?'La valeur de showdown et les possibilités de brelan sont importantes, mais la profondeur change fortement la stratégie.':suited?'La couleur potentielle et la jouabilité postflop améliorent la réalisation d’équité, sans garantir qu’un call soit profitable.':'Les mains offsuit réalisent souvent moins bien leur équité, surtout hors de position.'} ${posLate?'Ta position permet généralement des ranges plus larges qu’en début de parole.':'La position et les ranges de départ doivent être examinées avec prudence.'}`;
   if(s.facing===0){
     bullets.push(['Fold','Préserve ton stack, mais abandonne la possibilité de voler les blindes. Compare la main à une range d’ouverture pour cette position et cette profondeur.']);
     bullets.push(['Limp','Envisageable surtout dans certaines stratégies SB vs BB ; hors SB, le limp est rarement une ligne d’ouverture standard en MTT 6-max.']);
     bullets.push(['Raise 2 bb','Engage 2 bb, soit '+(200/s.stack).toFixed(1)+' % du stack. Il faut anticiper les reshoves et la défense des blindes avant d’ouvrir.']);
     bullets.push(['Shove','Engage '+s.stack+' bb : la fold equity peut compenser l’exposition au risque à faible profondeur, mais à stack profond le rapport risque/récompense se dégrade.']);
     calculation='Pour un open de 2 bb visant seulement les blindes, le seuil de folds dépend des antes et des blindes réellement en jeu. Les montants exacts ne sont pas renseignés : impossible de calculer un seuil précis.';
   }else{
     bullets.push(['Fold','Évite de subir la domination et de réaliser difficilement ton équité ; coûte toutefois la possibilité de défendre une main suffisamment forte.']);
     bullets.push(['Call','Garde les mains moins fortes dans la range adverse et évite de grossir le pot. La rentabilité dépend des cotes, de la position et de la réalisation d’équité.']);
     bullets.push(['3-bet / Raise','Cherche de la value ou de la fold equity. Les bloqueurs et la range de continuation adverse importent davantage qu’une simple note de force brute.']);
     bullets.push(['Shove','Maximise la pression préflop mais risque le stack effectif. Il faut comparer équité quand payé, folds obtenus et coût d’élimination.']);
     calculation=`Pot actuel ${s.pot} bb, montant restant à payer ${s.toCall} bb. Cotes directes du call : ${s.toCall>0?(100*s.toCall/(s.pot+s.toCall)).toFixed(1)+" %":"sans objet"}. Ces cotes ne tiennent pas compte de la réalisation d’équité ni de l’ICM.`;
   }
   risk=`Profil ${s.villainType.toLowerCase()} : adapte les ranges d’open, de call et de reshove à des observations réelles. Ne suppose pas qu’un adversaire inconnu suit une range standard.`;
 }else{
   const board=s.board.map(c=>c.r+c.s).join(' '),counts={};s.board.forEach(c=>counts[c.r]=(counts[c.r]||0)+1);
   const paired=Object.values(counts).some(x=>x>1),suitCounts={};s.board.forEach(c=>suitCounts[c.s]=(suitCounts[c.s]||0)+1);
   const maxSuit=Math.max(...Object.values(suitCounts)),connected=s.board.filter(c=>'TJQK9876'.includes(c.r)).length>=2;
   const hit=s.h.some(c=>s.board.some(b=>b.r===c.r));
   specific=`Board ${board}. ${paired?'Board pairé : les trips et full houses changent les avantages de nuts.':'Board non pairé.'} ${maxSuit>=3?'Trois cartes ou plus de même couleur : les flushes sont possibles.':maxSuit===2?'Deux cartes de même couleur : surveille les tirages et les bloqueurs.':'Board rainbow à ce stade.'} ${connected?'Plusieurs cartes connectables : examine les quintes et les tirages.':''} ${hit?'Ta main partage au moins un rang avec le board, sans que cela suffise à identifier précisément sa force relative.':'Pas de paire directe détectée avec le board ; vérifie les tirages, la hauteur et les possibilités de bluff.'}`;
   if(s.facing===0){
     bullets.push(['Check','Contrôle le pot, protège une range de check et conserve les bluffs adverses. Important avec showdown value moyenne ou sans avantage clair.']);
     bullets.push(['Bet 33%','Petit sizing : peut mettre sous pression une large range adverse et obtenir de la value fine ; requiert un plan face au raise.']);
     bullets.push(['Bet 75%','Sizing plus polarisé : exige davantage de value ou de bluffs crédibles, avec une range de défense adverse suffisamment faible.']);
     bullets.push(['Overbet 125%','Demande un avantage de nuts et une construction de range cohérente ; ne se justifie pas seulement parce que la main semble forte.']);
     calculation=`Si le pot avant mise est bien ${s.pot} bb : mise 33 % ≈ ${(s.pot*.33).toFixed(2)} bb, 75 % ≈ ${(s.pot*.75).toFixed(2)} bb, 125 % ≈ ${(s.pot*1.25).toFixed(2)} bb. Pour un bluff sans équité, les folds requis seraient respectivement 24,8 %, 42,9 % et 55,6 %, hors rake, relances et équité résiduelle.`;
   }else{
     bullets.push(['Fold','Abandonne l’équité potentielle mais évite un call perdant face à une range trop forte.']);
     bullets.push(['Call','Conserve les bluffs et réalise l’équité disponible ; vérifie la fréquence de bluff nécessaire et les cartes futures.']);
     bullets.push(['Raise 3x','Représente une range forte ou semi-bluff ; nécessite des bloqueurs, de la fold equity et un plan contre les reraises.']);
     bullets.push(['Shove','Crée une forte pression mais peut isoler contre une range très forte ; attention au SPR et à la couverture des stacks.']);
     const c=s.facing;calculation=`Le pot affiché (${s.pot} bb) inclut déjà la mise adverse de ${c} bb. Un call de ${s.toCall} bb exige ${(100*s.toCall/(s.pot+s.toCall)).toFixed(1)} % d’équité réalisée dans un modèle simplifié, hors ICM et futures mises.`;
   }
   risk=`Sans les actions préflop, les ranges des deux joueurs et le stack restant après les mises, on ne peut pas justifier une fréquence exacte de bet, call ou raise. ${s.street==='River'?'River : pas d’équité future à réaliser ; raisonne en value, bluffs et bloqueurs.':'Anticipe les turns/rivers qui changent l’avantage de nuts.'}`;
 }
 if(s.icm)risk+=' ICM : il manque les stacks de la table et les paliers pour calculer un risk premium.';
 if(s.pko)risk+=' PKO : il manque les primes et la structure des bounties pour quantifier les calls.';
 const explanation=bullets.map(([name,why])=>`<li style="margin-bottom:9px"><b>${esc(name)}${selected===name?' — ton choix':''} :</b> ${esc(why)}</li>`).join('');
 return `<h4>1. Lecture du spot</h4><p>${esc(specific)}</p><h4>2. Analyse de chaque option</h4><ul>${explanation}</ul><h4>3. Calculs et sizings</h4><p>${esc(calculation)}</p><h4>4. Ajustement exploitant et limites</h4><p>${esc(risk)}</p><h4>5. Point à retenir</h4><p>${esc(s.phase==='pre'?'Construis d’abord une range par position et profondeur, puis ajuste aux profils et à l’ICM. Une main ne se joue pas sur une note de force isolée.':'Commence par les ranges et l’avantage de nuts, puis choisis une ligne cohérente avec le sizing, les bloqueurs et les cartes futures.')}</p>`;
